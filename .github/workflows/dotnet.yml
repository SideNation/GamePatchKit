name: .NET

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      package-version: ${{ steps.package.outputs.package-version }}
      release-tag: ${{ steps.package.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve package version
        id: package
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            release_tag=$GITHUB_REF_NAME

            if [[ "$release_tag" != v?* ]]; then
              echo 'Release tag must use the v<NuGet version> format.' >&2
              exit 1
            fi

            version=${release_tag#v}
          else
            version=$(sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' Directory.Build.props)
            release_tag=v$version
          fi

          if [[ -z "$version" ]]; then
            echo 'Package version could not be resolved.' >&2
            exit 1
          fi

          echo "package-version=$version" >> "$GITHUB_OUTPUT"
          echo "release-tag=$release_tag" >> "$GITHUB_OUTPUT"

  test:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: macos-26
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    name: Test and smoke (${{ matrix.rid }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GamePatchKit.sln

      - name: Test
        run: dotnet test GamePatchKit.sln --configuration Release --no-restore

      - name: Pack
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package-version }}
        run: dotnet pack src/GamePatchKit.Cli/GamePatchKit.Cli.csproj --configuration Release --no-restore --output artifacts "-p:PackageVersion=$PACKAGE_VERSION"

      - name: Install local tool
        id: install
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package-version }}
        run: |
          tool_path=.gpk-tool
          dotnet tool install GamePatchKit.Cli --tool-path "$tool_path" --add-source artifacts --version "$PACKAGE_VERSION"
          tool_command="$tool_path/gpk"

          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_command="$tool_command.exe"
          fi

          if [[ ! -f "$tool_command" ]]; then
            echo "Installed gpk command was not found: $tool_command" >&2
            exit 1
          fi

          echo "tool-command=$tool_command" >> "$GITHUB_OUTPUT"

      - name: Run zstd smoke test
        shell: bash
        env:
          TOOL_COMMAND: ${{ steps.install.outputs.tool-command }}
        run: bash .github/scripts/smoke-test.sh "$TOOL_COMMAND" .gpk-smoke

      - name: Publish and test standalone executable
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package-version }}
          RID: ${{ matrix.rid }}
        run: |
          publish_dir=.gpk-standalone/publish
          asset_dir=.gpk-standalone/assets
          executable=gpk

          if [[ "$RUNNER_OS" == Windows ]]; then
            executable=gpk.exe
          fi

          dotnet publish src/GamePatchKit.Cli/GamePatchKit.Cli.csproj \
            --configuration Release \
            --runtime "$RID" \
            --self-contained true \
            --output "$publish_dir" \
            "-p:Version=$PACKAGE_VERSION" \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:DebugType=None \
            -p:DebugSymbols=false

          bash .github/scripts/smoke-test.sh "$publish_dir/$executable" .gpk-standalone/smoke

          mkdir -p "$asset_dir"
          tar -czf "$asset_dir/GamePatchKit.Cli-$PACKAGE_VERSION-$RID.tar.gz" \
            -C "$publish_dir" "$executable"

      - name: Upload smoke result
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: smoke-${{ matrix.rid }}
          path: .gpk-smoke/output
          if-no-files-found: error

      - name: Upload standalone release asset
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standalone-${{ matrix.rid }}
          path: .gpk-standalone/assets/*.tar.gz
          if-no-files-found: error

  compare:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download smoke results
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: smoke-*
          path: .gpk-smoke-results

      - name: Compare smoke results
        shell: bash
        run: bash .github/scripts/compare-smoke-results.sh .gpk-smoke-results

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [version, test, compare]
    runs-on: ubuntu-latest
    concurrency:
      group: gamepatchkit-cli-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify release version is new
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.version.outputs.release-tag }}
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null
          tag_status=$?
          set -e

          if [[ $tag_status -eq 0 ]]; then
            echo "Git tag already exists: $RELEASE_TAG. Increment <Version> in Directory.Build.props." >&2
            exit 1
          fi

          if [[ $tag_status -ne 2 ]]; then
            echo "Could not verify Git tag: $RELEASE_TAG." >&2
            exit "$tag_status"
          fi

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore GamePatchKit.sln

      - name: Pack release
        shell: bash
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.package-version }}
        run: dotnet pack src/GamePatchKit.Cli/GamePatchKit.Cli.csproj --configuration Release --no-restore --output artifacts "-p:PackageVersion=$PACKAGE_VERSION"

      - name: Download standalone release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: standalone-*
          path: release-assets
          merge-multiple: true

      - name: Publish to nuget.org
        shell: bash
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.release-tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$RELEASE_TAG" \
              artifacts/*.nupkg \
              release-assets/*.tar.gz \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" \
              artifacts/*.nupkg \
              release-assets/*.tar.gz \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi
