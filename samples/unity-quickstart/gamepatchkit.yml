schemaVersion: 1
packageId: unity-sample-data
# quickstart 샘플의 게임 데이터를 그대로 재사용한다. inputRoot는 Core-normalized
# 상대 경로가 아니라 host 경로라서 '..'를 써도 된다. 실행 중인 프로세스의 현재
# 디렉터리를 기준으로 해석되므로 serve.sh는 이 파일이 있는 디렉터리에서 실행한다.
inputRoot: ../quickstart/game-data
include:
  - "**/*"
# Unity 지원 범위는 아직 compression:none 뿐이다. zstd로 만든 release를 그대로
# 가리키면 활성화 전에 runtime.missing-compression-codec으로 실패한다.
compression:
  kind: none
groups:
  # 첫 화면에 필요한 최소 데이터. 활성화 전에 반드시 준비된다.
  - name: core
    include:
      - "core/**/*"
    artifactMode: file
    required: true
  # 필요한 시점에 따로 받는 optional group.
  - name: maps
    include:
      - "maps/**/*"
    artifactMode: bundle
    required: false
